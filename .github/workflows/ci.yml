name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowops_ci
          POSTGRES_DB: flowops_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops_ci -d flowops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
      - name: Configure isolated PostgreSQL integration URL
        run: printf '%s=%s%s\n' FLOWOPS_TEST_DATABASE_URL postgres '://flowops_ci@127.0.0.1:5432/flowops_ci?sslmode=disable' >> "$GITHUB_ENV"
      - name: Verify formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0r gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Prove real PostgreSQL cross-surface uniqueness
        run: go test -race ./internal/controlapi -run '^TestASCPRealPostgresCrossSurfaceDurableUniqueness$' -count=3
      - name: Validate ASCP v3.4 acceptance inventory
        run: make acceptance-manifest-check
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - name: Verify Solidity formatting
        run: forge fmt --check
      - name: Build Solidity contracts
        run: forge build --sizes
      - name: Test Solidity contracts
        run: forge test
      - name: Install typed-data SDK development dependencies
        run: npm ci --prefix sdk/typescript
      - name: Typecheck and test ASCP typed-data SDK
        run: npm run typecheck --prefix sdk/typescript && npm test --prefix sdk/typescript
      - name: Validate Base Sepolia deployment evidence
        run: make test-deployment-evidence
      - name: Validate Base mainnet readiness remains blocked
        run: make test-mainnet-readiness
      - name: Validate Base mainnet deployer and source ceremony
        run: make test-mainnet-deployer-verification
      - name: Validate external security-review package remains fail-closed
        run: make test-security-review-package
      - name: Validate final Base mainnet audit remains fail-closed
        run: make test-mainnet-final-audit
      - name: Install dashboard dependencies
        run: npm ci --prefix apps/dashboard
      - name: Audit dashboard runtime dependencies
        run: npm audit --omit=dev --audit-level=high --prefix apps/dashboard
      - name: Lint dashboard
        run: npm run lint --prefix apps/dashboard
      - name: Build and test dashboard
        run: npm test --prefix apps/dashboard
      - name: Install dashboard browser
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium
      - name: Run dashboard browser acceptance
        run: npm run test:browser --prefix apps/dashboard
